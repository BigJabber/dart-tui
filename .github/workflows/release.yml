name: Release

# Produces the downloadable Windows .exe files. Push a tag such as v1.0.0, or
# run this workflow by hand to get a draft release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.24"

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 ./...

      - name: Build every target
        env:
          CGO_ENABLED: "0"
        run: |
          version="$(git describe --tags --always 2>/dev/null || echo dev)"
          mkdir -p dist
          build() {
            GOOS=$1 GOARCH=$2 go build -trimpath \
              -ldflags "-s -w -X main.version=${version}" \
              -o "dist/darts-${1}-${2}${3}" ./cmd/darts
          }
          build windows amd64 .exe
          build windows arm64 .exe
          build linux   amd64 ""
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -lh dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
          body: |
            ## Downloads

            | Platform | File |
            | --- | --- |
            | Windows (most PCs) | `darts-windows-amd64.exe` |
            | Windows on ARM | `darts-windows-arm64.exe` |
            | Linux | `darts-linux-amd64` |

            Download the `.exe`, put it anywhere you like, and double-click it or
            run it from Windows Terminal. Nothing needs installing: no Go, no
            SQLite, no build tools, no administrator rights.

            Your games are saved to `%LOCALAPPDATA%\DartsTUI\darts.db`. Run
            `darts.exe -where` to print the exact path, or `-portable` to keep the
            database next to the executable instead.

            Verify a download against `SHA256SUMS.txt` if you wish.
